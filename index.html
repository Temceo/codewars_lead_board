<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Codewars Leaderboard</title>
</head>

<body>
  <main>
    <h1>Codewars Leaderboard</h1>
    <form>
      <label for="user-input">Enter usernames below separated by commas - eg user1, user2, user3 etc</label>
      <input type="text" name="user-input" id="user-input">
      <button type="submit">Submit</button>
    </form>
    <section class="results">
      <!-- results of search to go here -->
      <p id="results-message"></p>
      <p id="input-error"></p>

      <h2>Results</h2>
      <label for="results-dropdown">Select from dropdown</label>
      <select name="results-dropdown" id="results-dropdown">
        <option value="overall">overall</option>
      </select>
      <!-- leader board table -->
      <table class="leader-board">
        <thead>
          <tr>
            <th role="columnheader" scope="col">Username</th>
            <th role="columnheader" scope="col">Clan</th>
            <th role="columnheader" scope="col">Rating</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>
</body>

</html>
